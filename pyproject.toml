[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nativedq = { workspace = true }

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.17.1",
    "vulture>=2.16",
]

[tool.ruff.lint]
ignore = [
    "UP006",  # Use List instead of list
    "UP007",  # Use Union instead of X | Y
    "UP035",  # Deprecated imports from typing
]
