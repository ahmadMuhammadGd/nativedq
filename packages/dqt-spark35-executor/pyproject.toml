[project]
name = "dqt-executor-spark35"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dqt>=0.1,<0.2",
    "pyspark>=3.5,<3.6",
]

[project.optional-dependencies]
benchmark = [
    "dqt[benchmark]>=0.1,<0.2",
    "pytest>=9.1.1",
]

[project.entry-points."dqt.executors"]
spark35 = "dqt_spark35_executor:Spark35Executor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt_spark35_executor"]
