[project]
name = "dqt"
version = "0.1.0"
description = "yet another data quality tool"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.19",
    "open-data-contract-standard>=3.2.0,<3.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
benchmark = [
    "matplotlib>=3.11.1",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt"]
